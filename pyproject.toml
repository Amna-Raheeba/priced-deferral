[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "priced-deferral"
version = "0.1.0"
description = "Expected-cost escalation for uncertain agents: price answer, gather, and defer in one currency, and build the minimal deferral packet when deferring."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
